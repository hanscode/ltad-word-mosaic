<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LTAD 2026 — Live Lung Word Mosaic</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="src/styles.css" />
</head>
<body>
<main class="wall">
  <header class="wall__header">
    <p class="eyebrow">LTAD 2026 · Live wall</p>
    <h1 class="wall__title">What is the one word you hold onto today?</h1>
    <p class="wall__intro">Every word added today becomes part of the lungs. The more often a word is shared, the larger it grows.</p>
  </header>

  <section class="mosaic" aria-label="Live word mosaic">
    <img class="mosaic__mask" id="mask" src="assets/lung-mask.png" alt="" aria-hidden="true" />
    <div class="mosaic__stage" id="stage">
      <canvas class="mosaic__layer" id="layer-a" data-front="true"></canvas>
      <canvas class="mosaic__layer" id="layer-b" data-front="false"></canvas>
      <div class="mosaic__empty" id="empty" hidden>
        <strong>The wall is empty</strong>
        <span>Add the first word and the lungs begin to fill.</span>
      </div>
    </div>
    <div class="mosaic__tip" id="tip" role="status" hidden></div>
  </section>

  <section class="compose">
    <div class="compose__row">
      <input class="compose__input" id="word-input" maxlength="20" placeholder="One word" aria-label="Your word" autocomplete="off" />
      <button class="compose__submit" id="submit" type="button">Add My Word to the Cloud</button>
    </div>
    <div class="compose__meta">
      <p class="compose__helper" id="helper"></p>
      <p class="compose__stats" id="stats"></p>
    </div>
    <div class="compose__modes">
      <button class="compose__mode" id="toggle-data" type="button">Start empty</button>
      <button class="compose__mode" id="toggle-demo" type="button">Pause live submissions</button>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/wordcloud@1.2.3/src/wordcloud2.min.js"></script>
<script type="module" src="src/app.js"></script>
</body>
</html>
